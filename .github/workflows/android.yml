name: Build KivyMD Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev mpclib-dev libmpfr-dev libmpc-dev

    - name: Build APK with Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer kivy==2.3.0 kivymd==1.2.0 pillow
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: y

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivymd-chat-app-apk
        path: bin/*.apk

